name: Checks

# Deliberately separate from build.yaml_ (the publishing pipeline, currently disabled
# by its trailing underscore). This one only reads: it type-checks and runs tests, and
# never produces or uploads an artifact, so it is safe to have run on every push and PR.

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run validate

      # Keys used in code that exist in no locale render as their own name to the user. The ones
      # that were already like that are pinned in validate-locales.baseline.json, so this fails on
      # new ones only; the per-locale coverage table lands in the run summary either way.
      - name: Locales
        run: bun run validate:locales

      # Cosmetics whose bytes ship inside the build. `buildPack` can only check that a declared file
      # is present; that the bytes beside an entry are still the bytes that entry names is checkable
      # nowhere else, and a mismatch is the one way a pack can be wrong rather than merely stale.
      - name: Cosmetics pack
        run: bun run cosmetics:check

      # App tests (vitest, Vue SFCs) and package tests (bun test) run separately —
      # the packages import from "bun:test" and only bun can execute them.
      - name: Test
        run: bun run test

      # Re-runs the suites per package to measure them in isolation, then writes a
      # markdown table to the run summary. Not gated on a threshold: add --enforce to
      # the command below to make a package dropping under 50% fail the build.
      - name: Coverage
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: warn
