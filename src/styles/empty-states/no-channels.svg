<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .cu{animation:es-cu 3.6s cubic-bezier(.4,0,.2,1) .8s infinite;opacity:0}
.es-svg .bt{animation:es-bt 3.6s ease-in-out .8s infinite}
.es-svg .rp{animation:es-rp 3.6s ease-out .8s infinite;opacity:0}
.es-svg .nr{animation:es-nr 3.6s ease-out .8s infinite;opacity:0}
.es-svg .pl{animation:es-pl 2.2s ease-in-out .8s infinite}
@keyframes es-cu{0%,12%{opacity:0;transform:translate(34px,44px)}20%{opacity:1}40%{transform:translate(0,0)}48%{transform:translate(0,0) scale(.9)}56%{transform:translate(0,0) scale(1)}78%{opacity:1;transform:translate(0,0)}92%,100%{opacity:0;transform:translate(34px,44px)}}
@keyframes es-bt{0%,40%,64%,100%{transform:scale(1)}47%{transform:scale(.85)}56%{transform:scale(1.1)}}
@keyframes es-rp{0%,46%{opacity:0;transform:scale(.9)}50%{opacity:.7}86%,100%{opacity:0;transform:scale(2)}}
@keyframes es-nr{0%,48%{opacity:0;transform:translateY(8px)}60%{opacity:1;transform:translateY(0)}86%{opacity:1}96%,100%{opacity:0}}
@keyframes es-pl{0%,100%{opacity:.5}50%{opacity:1}}</style>
<defs><radialGradient id="g-nochannels" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient>
<mask id="m-nochannels"><rect width="200" height="200" fill="#fff"></rect><circle cx="165" cy="44" r="12" fill="#000"></circle></mask></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-nochannels)"></circle>
<g font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="13" style="fill:var(--es-line-strong,#5c5e6b)">
<g class="e in" style="animation-delay:.05s"><rect x="36" y="46" width="98" height="20" rx="10" fill="none" stroke-width="2.5" stroke-dasharray="6 5" style="stroke:var(--es-line,#3a3b45)"></rect><text x="47" y="61">#</text></g>
<g class="e in" style="animation-delay:.15s"><rect x="36" y="76" width="98" height="20" rx="10" fill="none" stroke-width="2.5" stroke-dasharray="6 5" style="stroke:var(--es-line,#3a3b45)"></rect><text x="47" y="91">#</text></g>
<g class="e in" style="animation-delay:.25s"><rect x="36" y="106" width="98" height="20" rx="10" fill="none" stroke-width="2.5" stroke-dasharray="6 5" style="stroke:var(--es-line,#3a3b45)"></rect><text x="47" y="121">#</text></g>
<g class="e nr"><rect x="36" y="46" width="98" height="20" rx="10" fill-opacity=".2" stroke-width="2.5" style="fill:var(--es-accent-deep,#7c5cf5);stroke:var(--es-accent-deep,#7c5cf5)"></rect><text x="47" y="61" style="fill:var(--es-accent,#a78bfa)">#</text><rect x="62" y="53" width="40" height="6" rx="3" style="fill:var(--es-accent,#a78bfa)"></rect></g>
</g>
<g class="e in" style="animation-delay:.45s">
<circle class="e rp" cx="148" cy="140" r="22" fill="none" stroke-width="2" style="stroke:var(--es-accent,#a78bfa)"></circle>
<g class="e bt pl"><circle cx="148" cy="140" r="22" style="fill:var(--es-accent-deep,#7c5cf5)"></circle><path d="M148 130v20M138 140h20" stroke-width="3.5" stroke-linecap="round" style="stroke:var(--es-on-accent,#fff)"></path></g>
</g>
<g class="e cu"><path d="M150 142v21l5.5-4.8 4 9.3 4.2-1.9-4-9.2 7.3-.2z" stroke-width="1.6" stroke-linejoin="round" style="fill:var(--es-on-accent,#fff);stroke:var(--es-void,#131316)"></path></g>
</svg>