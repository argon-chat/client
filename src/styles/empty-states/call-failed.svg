<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .lnk{stroke-dasharray:6 5;animation:es-lnk 1.2s linear .9s infinite}
.es-svg .brk{animation:es-brk 3.6s steps(1,end) 1s infinite}
.es-svg .brk2{animation:es-brk2 3.6s steps(1,end) 1s infinite;opacity:0}
.es-svg .xf{animation:es-xf 3.6s cubic-bezier(.2,.9,.3,1.3) 1s infinite}
.es-svg .av1{animation:es-av1 3.6s ease-in-out 1s infinite}
.es-svg .av2{animation:es-av2 3.6s ease-in-out 1s infinite}
.es-svg .rg1{animation:es-rg1 3.6s ease-out 1s infinite;opacity:0}
@keyframes es-lnk{to{stroke-dashoffset:-11}}
@keyframes es-brk{0%,40%{opacity:1}42%,100%{opacity:0}}
@keyframes es-brk2{0%,40%{opacity:0}42%,100%{opacity:1}}
@keyframes es-xf{0%,40%{transform:scale(0)}50%,90%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes es-av1{0%,40%,100%{transform:translateX(0)}50%,88%{transform:translateX(-8px)}}
@keyframes es-av2{0%,40%,100%{transform:translateX(0)}50%,88%{transform:translateX(8px)}}
@keyframes es-rg1{0%,40%{opacity:0;transform:scale(.6)}46%{opacity:.7}80%,100%{opacity:0;transform:scale(1.8)}}</style>
<defs><radialGradient id="g-callfailed" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-callfailed)"></circle>
<circle class="e rg1" cx="100" cy="100" r="18" fill="none" stroke-width="2" style="stroke:var(--es-danger,#f04747)"></circle>
<g class="e in"><g class="e fl">
<g class="brk"><path class="lnk" d="M72 100h56" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></path></g>
<g class="brk2"><path d="M72 100h14M114 100h14" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path></g>
<g class="e av1"><circle cx="52" cy="100" r="24" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></circle><circle cx="52" cy="93" r="8" style="fill:var(--es-line,#3a3b45)"></circle><path d="M38 118a14 14 0 0 1 28 0" style="fill:var(--es-line,#3a3b45)"></path></g>
<g class="e av2"><circle cx="148" cy="100" r="24" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></circle><circle cx="148" cy="93" r="8" style="fill:var(--es-line,#3a3b45)"></circle><path d="M134 118a14 14 0 0 1 28 0" style="fill:var(--es-line,#3a3b45)"></path></g>
<g class="e xf"><circle cx="100" cy="100" r="14" style="fill:var(--es-danger,#f04747)"></circle><path d="M95 95l10 10M105 95l-10 10" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-on-accent,#fff)"></path></g>
</g></g>
<g class="e in" style="animation-delay:.4s"><g transform="translate(100 150)"><path d="M-14 0a20 20 0 0 1 28 0" fill="none" stroke-width="8" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path><circle cx="-14" cy="0" r="6" style="fill:var(--es-line,#3a3b45)"></circle><circle cx="14" cy="0" r="6" style="fill:var(--es-line,#3a3b45)"></circle></g></g>
</svg>