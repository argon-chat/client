<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .wob{animation:es-wob 3.6s ease-in-out 1s infinite}
.es-svg .rtr{animation:es-rtr 3.6s cubic-bezier(.6,0,.3,1) 1s infinite}
.es-svg .crk{stroke-dasharray:60;stroke-dashoffset:60;animation:es-crk .5s ease-out .6s forwards}
.es-svg .wrn{animation:es-wrn 1.6s ease-in-out .9s infinite}
@keyframes es-wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
@keyframes es-rtr{0%,55%{transform:rotate(0)}85%,100%{transform:rotate(360deg)}}
@keyframes es-crk{to{stroke-dashoffset:0}}
@keyframes es-wrn{0%,100%{opacity:.5}50%{opacity:1}}</style>
<defs><radialGradient id="g-errorgeneric" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-errorgeneric)"></circle>
<g class="e in"><g class="e fl"><g class="e wob">
<rect x="44" y="56" width="112" height="84" rx="12" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect x="44" y="56" width="112" height="18" rx="12" style="fill:var(--es-surface-2,#2c2d34)"></rect><rect x="44" y="68" width="112" height="6" style="fill:var(--es-surface-2,#2c2d34)"></rect>
<circle cx="56" cy="65" r="3" style="fill:var(--es-danger,#f04747)"></circle><circle cx="66" cy="65" r="3" style="fill:var(--es-warning,#f0b232)"></circle><circle cx="76" cy="65" r="3" style="fill:var(--es-ok,#3ba55c)"></circle>
<path class="crk" d="M96 74l6 12-9 8 8 10-5 14" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--es-danger,#f04747)"></path>
<g class="e wrn"><path d="M136 88l12 22h-24z" style="fill:var(--es-danger,#f04747)"></path><path d="M136 96v7" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--es-void,#131316)"></path><circle cx="136" cy="106.5" r="1.4" style="fill:var(--es-void,#131316)"></circle></g>
<rect x="56" y="118" width="40" height="5" rx="2.5" style="fill:var(--es-line,#3a3b45)"></rect><rect x="56" y="127" width="26" height="5" rx="2.5" style="fill:var(--es-surface-2,#2c2d34)"></rect>
</g></g></g>
<g class="e in" style="animation-delay:.4s"><g class="e rtr" style="transform-origin:100px 156px;transform-box:view-box">
<circle cx="100" cy="156" r="16" style="fill:var(--es-accent-deep,#7c5cf5)"></circle>
<path d="M92 156a8 8 0 1 1 3 6" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-on-accent,#fff)"></path><path d="M93 166l2-5 5 2z" style="fill:var(--es-on-accent,#fff)"></path>
</g></g>
</svg>