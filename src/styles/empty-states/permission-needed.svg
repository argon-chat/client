<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .tg{animation:es-tg 3.2s cubic-bezier(.4,0,.2,1) 1s infinite}
.es-svg .tgb{animation:es-tgb 3.2s cubic-bezier(.4,0,.2,1) 1s infinite}
.es-svg .dev{animation:es-dev 3.2s cubic-bezier(.4,0,.2,1) 1s infinite}
.es-svg .arr{animation:es-arr 1.4s ease-in-out .9s infinite}
@keyframes es-tg{0%,40%{transform:translateX(0)}55%,85%{transform:translateX(22px)}100%{transform:translateX(0)}}
@keyframes es-tgb{0%,40%{fill:var(--es-line,#3a3b45)}55%,85%{fill:var(--es-ok,#3ba55c)}100%{fill:var(--es-line,#3a3b45)}}
@keyframes es-dev{0%,40%{fill:var(--es-line,#3a3b45)}55%,85%{fill:var(--es-accent,#a78bfa)}100%{fill:var(--es-line,#3a3b45)}}
@keyframes es-arr{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}</style>
<defs><radialGradient id="g-permission" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-permission)"></circle>
<g class="e in"><g class="e fl">
<rect x="40" y="52" width="120" height="96" rx="14" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect class="dev" x="58" y="70" width="18" height="28" rx="9"></rect><path d="M52 90a15 15 0 0 0 30 0M67 105v8M60 113h14" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path>
<rect class="dev" x="100" y="76" width="30" height="24" rx="6"></rect><path class="dev" d="M130 82l12-6v24l-12-6z"></path>
<rect class="tgb" x="76" y="122" width="48" height="24" rx="12"></rect>
<circle class="e tg" cx="88" cy="134" r="9" style="fill:var(--es-paper,#e4e4e8)"></circle>
</g></g>
<g class="e in" style="animation-delay:.4s"><g class="e arr"><path d="M100 178v-16M92 170l8-8 8 8" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--es-accent,#a78bfa)"></path></g></g>
</svg>