<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .sh{animation:es-sh 3.6s ease-in-out 1.2s infinite}
.es-svg .sk{animation:es-sk 3.6s ease-in-out 1.2s infinite}
.es-svg .ky{animation:es-ky 3.6s ease-in-out 1.2s infinite}
.es-svg .rl{animation:es-rl 3.6s ease-out 1.2s infinite;opacity:0}
.es-svg .led{animation:es-led 3.6s steps(1,end) 1.2s infinite}
@keyframes es-sh{0%,60%,100%{transform:translateX(0)}66%{transform:translateX(-5px)}72%{transform:translateX(5px)}78%{transform:translateX(-3px)}84%{transform:translateX(3px)}90%{transform:translateX(0)}}
@keyframes es-sk{0%,55%,100%{transform:translateY(0) rotate(0)}60%{transform:translateY(-4px) rotate(-8deg)}64%{transform:translateY(0) rotate(0)}}
@keyframes es-ky{0%,20%{transform:translate(0,0) rotate(0)}50%{transform:translate(-26px,-18px) rotate(-30deg)}58%{transform:translate(-30px,-22px) rotate(-38deg)}64%{transform:translate(-22px,-14px) rotate(-22deg)}80%,100%{transform:translate(0,0) rotate(0)}}
@keyframes es-rl{0%,58%{opacity:0;transform:scale(.8)}62%{opacity:.6}90%,100%{opacity:0;transform:scale(1.5)}}
@keyframes es-led{0%,58%{fill:var(--es-line,#3a3b45)}60%,68%{fill:var(--es-danger,#f04747)}70%,100%{fill:var(--es-line,#3a3b45)}}</style>
<defs><radialGradient id="g-unauth" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-unauth)"></circle>
<g class="e in"><g class="e fl"><g class="e sh">
<circle class="e rl" cx="100" cy="112" r="40" fill="none" stroke-width="2.5" style="stroke:var(--es-danger,#f04747)"></circle>
<g class="e sk"><path d="M74 90V74a26 26 0 0 1 52 0v16" fill="none" stroke-width="10" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path></g>
<rect x="56" y="86" width="88" height="66" rx="16" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<circle class="led" cx="100" cy="114" r="8"></circle><rect x="96.5" y="118" width="7" height="16" rx="3" style="fill:var(--es-line,#3a3b45)"></rect>
</g></g></g>
<g class="e in" style="animation-delay:.4s"><g class="e ky">
<g transform="translate(150 150) rotate(-40)">
<circle cx="0" cy="0" r="10" fill="none" stroke-width="5" style="stroke:var(--es-accent,#a78bfa)"></circle>
<rect x="8" y="-2.5" width="30" height="5" rx="2.5" style="fill:var(--es-accent,#a78bfa)"></rect>
<rect x="26" y="2" width="4" height="7" rx="1.5" style="fill:var(--es-accent,#a78bfa)"></rect><rect x="33" y="2" width="4" height="9" rx="1.5" style="fill:var(--es-accent,#a78bfa)"></rect>
</g></g></g>
<g class="e in" style="animation-delay:.55s"><text x="100" y="180" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="14" letter-spacing="3" style="fill:var(--es-line-strong,#5c5e6b)">401</text></g>
</svg>