<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .cn{animation:es-cn 2.4s ease-in-out .9s infinite}
.es-svg .rc{animation:es-rc 4s ease-in-out .9s infinite}
.es-svg .ln{animation:es-ln 2.6s ease-in-out .9s infinite}
@keyframes es-cn{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@keyframes es-rc{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes es-ln{0%,100%{opacity:.3}50%{opacity:.8}}</style>
<defs><radialGradient id="g-notransactions" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-notransactions)"></circle>
<g class="e in"><g class="e rc">
<path d="M60 48h80v112l-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6z" stroke-width="3" stroke-linejoin="round" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></path>
<rect x="72" y="64" width="56" height="6" rx="3" style="fill:var(--es-line,#3a3b45)"></rect>
<g style="fill:var(--es-line,#3a3b45)"><rect class="ln" x="72" y="84" width="34" height="5" rx="2.5"></rect><rect class="ln" style="animation-delay:.4s" x="72" y="98" width="42" height="5" rx="2.5"></rect><rect class="ln" style="animation-delay:.8s" x="72" y="112" width="28" height="5" rx="2.5"></rect></g>
<rect x="72" y="130" width="56" height="2" style="fill:var(--es-surface-2,#2c2d34)"></rect>
</g></g>
<g class="e in" style="animation-delay:.4s"><g class="e fl"><g class="e cn"><circle cx="146" cy="140" r="18" style="fill:var(--es-warning,#f0b232)"></circle><circle cx="146" cy="140" r="12" fill="none" stroke-width="2.5" style="stroke:var(--es-warning-deep,#c98f1a)"></circle><text x="146" y="146" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="15" style="fill:var(--es-warning-deep,#c98f1a)">$</text></g></g></g>
</svg>