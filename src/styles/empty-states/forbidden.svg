<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .hd{animation:es-hd 4s ease-in-out 1s infinite}
.es-svg .fh{animation:es-fh 4s ease-in-out 1s infinite}
.es-svg .ey{animation:es-ey 4s steps(1,end) 1s infinite}
.es-svg .bl{animation:es-bl 2s ease-in-out .9s infinite}
.es-svg .tp{animation:es-tp 4s ease-in-out 1s infinite}
@keyframes es-hd{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes es-fh{0%,70%,100%{transform:translate(0,0)}78%{transform:translate(-4px,-2px)}86%{transform:translate(4px,-2px)}94%{transform:translate(0,0)}}
@keyframes es-ey{0%,30%,37%,100%{transform:scaleY(1)}32%,36%{transform:scaleY(.1)}}
@keyframes es-bl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes es-tp{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}</style>
<defs><radialGradient id="g-forbidden" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-forbidden)"></circle>
<g class="e in" style="animation-delay:.3s"><g class="e tp">
<rect x="34" y="128" width="6" height="36" rx="3" style="fill:var(--es-line,#3a3b45)"></rect><rect x="160" y="128" width="6" height="36" rx="3" style="fill:var(--es-line,#3a3b45)"></rect>
<circle cx="37" cy="126" r="5" style="fill:var(--es-line-strong,#5c5e6b)"></circle><circle cx="163" cy="126" r="5" style="fill:var(--es-line-strong,#5c5e6b)"></circle>
<path d="M40 130q60 26 120 0" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--es-danger,#f04747)"></path></g></g>
<g class="e in"><g class="e fl"><g class="e hd">
<path d="M100 40l44 14v34c0 26-19 44-44 54-25-10-44-28-44-54V54z" stroke-width="3" stroke-linejoin="round" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></path>
<g class="e fh"><g class="e ey">
<ellipse cx="100" cy="90" rx="22" ry="13" stroke-width="2.5" style="fill:var(--es-void,#131316);stroke:var(--es-line-strong,#5c5e6b)"></ellipse>
<circle cx="100" cy="90" r="7" style="fill:var(--es-danger,#f04747)"></circle><circle class="e bl" cx="100" cy="90" r="3" style="fill:var(--es-danger-soft,#ffb3b3)"></circle>
</g></g>
</g></g></g>
<g class="e in" style="animation-delay:.5s"><text x="100" y="184" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="14" letter-spacing="3" style="fill:var(--es-line-strong,#5c5e6b)">403</text></g>
</svg>