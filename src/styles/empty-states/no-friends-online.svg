<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .z{animation:es-zz 2.6s ease-out infinite;opacity:0}
.es-svg .br{animation:es-br 3.4s ease-in-out .8s infinite}
.es-svg .moon{animation:es-moon 5s ease-in-out .9s infinite}
@keyframes es-zz{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(12px,-30px) scale(1.15)}}
@keyframes es-br{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.025) rotate(-1.5deg)}}
@keyframes es-moon{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(8deg)}}</style>
<defs><radialGradient id="g-nofriends" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient>
<mask id="m-nofriends"><rect width="200" height="200" fill="#fff"></rect><circle cx="165" cy="44" r="12" fill="#000"></circle></mask></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-nofriends)"></circle>
<g class="e in" style="animation-delay:.35s"><g class="e moon"><circle cx="158" cy="48" r="14" mask="url(#m-nofriends)" style="fill:var(--es-line,#3a3b45)"></circle></g></g>
<g class="e in"><g class="e fl"><g class="e br">
<rect x="44" y="80" width="112" height="60" rx="30" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect x="66" y="98" width="7" height="24" rx="2.5" style="fill:var(--es-line,#3a3b45)"></rect><rect x="57.5" y="106.5" width="24" height="7" rx="2.5" style="fill:var(--es-line,#3a3b45)"></rect>
<circle cx="132" cy="98" r="4.5" style="fill:var(--es-line,#3a3b45)"></circle><circle cx="142" cy="108" r="4.5" style="fill:var(--es-line,#3a3b45)"></circle><circle cx="132" cy="118" r="4.5" style="fill:var(--es-line,#3a3b45)"></circle><circle cx="122" cy="108" r="4.5" style="fill:var(--es-accent,#a78bfa)"></circle>
<path d="M92 112q4 4 8 0M100 112q4 4 8 0" stroke-width="2.5" fill="none" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></path>
</g></g></g>
<g font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" style="fill:var(--es-accent,#a78bfa)">
<g class="e z" style="animation-delay:1s"><text x="146" y="80" font-size="13">z</text></g>
<g class="e z" style="animation-delay:1.85s"><text x="152" y="76" font-size="17">z</text></g>
<g class="e z" style="animation-delay:2.7s"><text x="158" y="72" font-size="21">z</text></g>
</g>
</svg>