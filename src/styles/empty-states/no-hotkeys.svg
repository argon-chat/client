<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .k1{animation:es-kp 3s cubic-bezier(.4,0,.2,1) .9s infinite}
.es-svg .k2{animation:es-kp 3s cubic-bezier(.4,0,.2,1) 1.3s infinite}
.es-svg .k3{animation:es-kp 3s cubic-bezier(.4,0,.2,1) 1.7s infinite}
.es-svg .kf1{animation:es-kf 3s steps(1,end) .9s infinite}
.es-svg .kf2{animation:es-kf 3s steps(1,end) 1.3s infinite}
.es-svg .kf3{animation:es-kf 3s steps(1,end) 1.7s infinite}
@keyframes es-kp{0%,10%,100%{transform:translateY(0)}5%{transform:translateY(4px)}}
@keyframes es-kf{0%,10%,100%{fill:var(--es-line,#3a3b45)}3%,8%{fill:var(--es-accent,#a78bfa)}}</style>
<defs><radialGradient id="g-nohotkeys" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-nohotkeys)"></circle>
<g class="e in"><g class="e fl">
<g class="e k1"><rect x="34" y="94" width="40" height="36" rx="8" style="fill:var(--es-surface-2,#2c2d34)"></rect><rect class="kf1" x="34" y="88" width="40" height="36" rx="8"></rect><rect x="38" y="92" width="32" height="26" rx="5" style="fill:var(--es-surface,#23242b)"></rect><text x="54" y="110" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="13" style="fill:var(--es-paper-dim,#8b8d97)">⌘</text></g>
<g class="e k2"><rect x="80" y="94" width="40" height="36" rx="8" style="fill:var(--es-surface-2,#2c2d34)"></rect><rect class="kf2" x="80" y="88" width="40" height="36" rx="8"></rect><rect x="84" y="92" width="32" height="26" rx="5" style="fill:var(--es-surface,#23242b)"></rect><text x="100" y="110" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="13" style="fill:var(--es-paper-dim,#8b8d97)">⇧</text></g>
<g class="e k3"><rect x="126" y="94" width="40" height="36" rx="8" style="fill:var(--es-surface-2,#2c2d34)"></rect><rect class="kf3" x="126" y="88" width="40" height="36" rx="8"></rect><rect x="130" y="92" width="32" height="26" rx="5" style="fill:var(--es-surface,#23242b)"></rect><text x="146" y="110" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="13" style="fill:var(--es-paper-dim,#8b8d97)">?</text></g>
</g></g>
<g class="e in" style="animation-delay:.3s"><rect x="60" y="146" width="80" height="6" rx="3" style="fill:var(--es-surface-2,#2c2d34)"></rect></g>
</svg>