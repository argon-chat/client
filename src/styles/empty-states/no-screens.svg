<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .win{animation:es-win 3.6s ease-in-out .9s infinite}
.es-svg .swp{animation:es-swp 3.6s ease-in-out .9s infinite}
@keyframes es-win{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes es-swp{0%{transform:translateX(-70px)}100%{transform:translateX(70px)}}</style>
<defs><radialGradient id="g-noscreens" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-noscreens)"></circle><defs><clipPath id="c-noscreens"><rect x="44" y="56" width="112" height="72" rx="8"></rect></clipPath></defs>
<g class="e in"><g class="e fl">
<rect x="40" y="52" width="120" height="80" rx="12" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect x="44" y="56" width="112" height="72" rx="8" style="fill:var(--es-void,#131316)"></rect>
<g class="e win"><rect x="56" y="68" width="40" height="28" rx="4" fill="none" stroke-width="2" stroke-dasharray="4 3" style="stroke:var(--es-accent,#a78bfa)"></rect></g>
<g class="e win" style="animation-delay:1.2s"><rect x="104" y="80" width="40" height="28" rx="4" fill="none" stroke-width="2" stroke-dasharray="4 3" style="stroke:var(--es-accent,#a78bfa)"></rect></g>
<g clip-path="url(#c-noscreens)"><rect class="e swp" x="90" y="52" width="20" height="80" opacity=".12" transform="skewX(-15)" style="fill:var(--es-accent,#a78bfa)"></rect></g>
<path d="M86 148h28M100 132v16" stroke-width="5" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path>
</g></g>
</svg>