<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .dsh{animation:es-dsh 2s linear .9s infinite}
.es-svg .sc2{animation:es-sc2 3s ease-in-out .9s infinite}
.es-svg .q{animation:es-q 3s ease-in-out .9s infinite}
@keyframes es-dsh{to{stroke-dashoffset:-20}}
@keyframes es-sc2{0%,100%{transform:translateX(-52px)}50%{transform:translateX(52px)}}
@keyframes es-q{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}</style>
<defs><radialGradient id="g-nodevices" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-nodevices)"></circle>
<g class="e in"><g class="e fl">
<rect class="dsh" x="36" y="80" width="128" height="56" rx="14" fill="none" stroke-width="2.5" stroke-dasharray="6 4" style="stroke:var(--es-line,#3a3b45)"></rect>
<g fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-line-strong,#5c5e6b)">
<rect x="54" y="92" width="12" height="20" rx="6"></rect><path d="M50 106a10 10 0 0 0 20 0M60 116v6"></path>
<rect x="88" y="96" width="20" height="16" rx="4"></rect><path d="M108 100l8-4v16l-8-4z"></path>
<path d="M132 98v14h6l8 6V92l-8 6z" stroke-linejoin="round"></path><path d="M152 100q4 4 0 8"></path>
</g>
<g class="e sc2"><rect x="97" y="82" width="6" height="52" rx="3" opacity=".5" style="fill:var(--es-accent,#a78bfa)"></rect></g>
</g></g>
<g class="e in" style="animation-delay:.4s"><g class="e q"><circle cx="100" cy="56" r="14" style="fill:var(--es-accent-deep,#7c5cf5)"></circle><text x="100" y="62" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="17" style="fill:var(--es-on-accent,#fff)">?</text></g></g>
</svg>