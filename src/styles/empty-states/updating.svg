<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .rot{animation:es-rot 4s cubic-bezier(.5,0,.5,1) .9s infinite}
.es-svg .rng{animation:es-rng 4s cubic-bezier(.4,0,.2,1) .9s infinite,rgc 4s steps(1,end) .9s infinite}
.es-svg .aro{animation:es-aro 4s steps(1,end) .9s infinite}
.es-svg .ok{animation:es-ok 4s cubic-bezier(.2,.9,.3,1.3) .9s infinite}
.es-svg .bst{animation:es-bst 4s ease-out .9s infinite;opacity:0}
.es-svg .sk2{animation:es-sk2 4s ease-out .9s infinite;opacity:0}
.es-svg .tl{animation:es-tl 4s cubic-bezier(.4,0,.2,1) .9s infinite}
@keyframes es-rot{0%{transform:rotate(0)}70%,100%{transform:rotate(720deg)}}
@keyframes es-rng{0%{stroke-dashoffset:289;opacity:1}70%{stroke-dashoffset:0;opacity:1}86%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes es-rgc{0%,70%{stroke:var(--es-accent,#a78bfa)}71%,100%{stroke:var(--es-ok,#3ba55c)}}
@keyframes es-aro{0%,70%{opacity:1}71%,100%{opacity:0}}
@keyframes es-ok{0%,70%{transform:scale(0)}78%,90%{transform:scale(1)}96%,100%{transform:scale(0)}}
@keyframes es-bst{0%,70%{opacity:0;transform:scale(.8)}74%{opacity:.7}92%,100%{opacity:0;transform:scale(1.5)}}
@keyframes es-sk2{0%,70%{opacity:0;transform:scale(0)}76%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(.6) translateY(-10px)}}
@keyframes es-tl{0%,70%{transform:scale(1)}76%{transform:scale(1.1)}84%,100%{transform:scale(1)}}</style>
<defs><radialGradient id="g-updating" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-updating)"></circle>
<circle class="e bst" cx="100" cy="100" r="50" fill="none" stroke-width="2" style="stroke:var(--es-ok,#3ba55c)"></circle>
<g class="e in"><g class="e fl">
<circle cx="100" cy="100" r="46" fill="none" stroke-width="5" style="stroke:var(--es-surface-2,#2c2d34)"></circle>
<circle class="rng" cx="100" cy="100" r="46" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" transform="rotate(-90 100 100)"></circle>
<g class="e tl">
<rect x="70" y="70" width="60" height="60" rx="16" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<g class="aro"><g class="e rot" style="transform-origin:100px 100px;transform-box:view-box">
<path d="M100 82a18 18 0 0 1 16 9" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></path><path d="M113 86l5 7-9 1z" style="fill:var(--es-accent,#a78bfa)"></path>
<path d="M100 118a18 18 0 0 1-16-9" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></path><path d="M87 114l-5-7 9-1z" style="fill:var(--es-accent,#a78bfa)"></path>
</g></g>
<g class="e ok"><path d="M88 100l8 8 16-16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--es-ok,#3ba55c)"></path></g>
</g>
</g></g>
<g style="fill:var(--es-ok,#3ba55c)">
<g class="e sk2"><path transform="translate(146 56)" d="M0-7L1.8-1.8 7 0 1.8 1.8 0 7-1.8 1.8-7 0-1.8-1.8Z"></path></g>
<g class="e sk2" style="animation-delay:.15s"><path transform="translate(52 66)" d="M0-5L1.3-1.3 5 0 1.3 1.3 0 5-1.3 1.3-5 0-1.3-1.3Z"></path></g>
<g class="e sk2" style="animation-delay:.3s"><path transform="translate(150 140)" d="M0-4L1-1 4 0 1 1 0 4-1 1-4 0-1-1Z"></path></g>
</g>
</svg>