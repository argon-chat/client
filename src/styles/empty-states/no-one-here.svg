<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .sw{animation:es-sw 4.5s ease-in-out .9s infinite}
.es-svg .wv{animation:es-wv 2.4s ease-out 1s infinite;opacity:0}
.es-svg .dt{animation:es-dt 1.4s ease-in-out .9s infinite}
.es-svg .mic{animation:es-mic 3s ease-in-out .9s infinite}
@keyframes es-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes es-wv{0%{opacity:0;transform:scale(.7)}25%{opacity:.6}100%{opacity:0;transform:scale(1.25)}}
@keyframes es-dt{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes es-mic{0%,100%{opacity:.4}50%{opacity:1}}</style>
<defs><radialGradient id="g-noone" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-noone)"></circle>
<circle class="e wv" cx="100" cy="98" r="52" fill="none" stroke-width="2" style="stroke:var(--es-accent,#a78bfa)"></circle>
<circle class="e wv" style="animation-delay:2.2s;stroke:var(--es-accent,#a78bfa)" cx="100" cy="98" r="52" fill="none" stroke-width="2"></circle>
<g class="e in" style="animation-delay:.1s"><rect x="94" y="28" width="12" height="10" rx="3" style="fill:var(--es-line,#3a3b45)"></rect></g>
<g class="e in"><g class="e sw" style="transform-origin:100px 36px;transform-box:view-box">
<path d="M100 36v12" stroke-width="3" style="stroke:var(--es-line,#3a3b45)"></path>
<path d="M62 106v-14a38 38 0 0 1 76 0v14" fill="none" stroke-width="12" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path>
<path d="M62 106v-14a38 38 0 0 1 76 0v14" fill="none" stroke-width="6" stroke-linecap="round" style="stroke:var(--es-surface,#23242b)"></path>
<rect x="48" y="100" width="24" height="36" rx="10" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect x="128" y="100" width="24" height="36" rx="10" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect x="56" y="108" width="8" height="20" rx="4" style="fill:var(--es-accent-deep,#7c5cf5)"></rect><rect x="136" y="108" width="8" height="20" rx="4" style="fill:var(--es-accent-deep,#7c5cf5)"></rect>
<path d="M60 136q0 22 24 22h10" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-line,#3a3b45)"></path>
<g class="e mic"><rect x="90" y="150" width="14" height="18" rx="7" style="fill:var(--es-accent,#a78bfa)"></rect></g>
</g></g>
<g style="fill:var(--es-accent,#a78bfa)"><circle class="e dt" cx="130" cy="164" r="3"></circle><circle class="e dt" style="animation-delay:.2s" cx="141" cy="164" r="3"></circle><circle class="e dt" style="animation-delay:.4s" cx="152" cy="164" r="3"></circle></g>
</svg>