<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .kc{animation:es-kc 4s ease-in-out .9s infinite}
.es-svg .khp{animation:es-khp 2s ease-in-out .9s infinite}
.es-svg .lnk2{stroke-dasharray:4 5;animation:es-lnk2 1.4s linear .9s infinite}
.es-svg .plp{animation:es-plp 2s ease-in-out .9s infinite}
.es-svg .ph{animation:es-ph 4s ease-in-out .9s infinite}
@keyframes es-kc{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-4px)}}
@keyframes es-khp{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes es-lnk2{to{stroke-dashoffset:-9}}
@keyframes es-plp{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes es-ph{0%,100%{transform:rotate(4deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}</style>
<defs><radialGradient id="g-nopasskeys" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-nopasskeys)"></circle>
<g class="e in" style="animation-delay:.3s"><path class="lnk2" d="M92 104q8 10 20 6" fill="none" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></path></g>
<g class="e in"><g class="e kc" style="transform-origin:64px 104px;transform-box:view-box">
<rect x="30" y="72" width="64" height="64" rx="14" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<g class="e khp"><circle cx="62" cy="98" r="9" style="fill:var(--es-accent-deep,#7c5cf5)"></circle><rect x="58.5" y="102" width="7" height="16" rx="3.5" style="fill:var(--es-accent-deep,#7c5cf5)"></rect></g>
<rect x="42" y="124" width="24" height="4" rx="2" style="fill:var(--es-line,#3a3b45)"></rect>
</g></g>
<g class="e in" style="animation-delay:.2s"><g class="e ph" style="transform-origin:138px 104px;transform-box:view-box">
<rect x="112" y="60" width="52" height="88" rx="12" stroke-width="3" style="fill:var(--es-surface,#23242b);stroke:var(--es-line,#3a3b45)"></rect>
<rect x="118" y="70" width="40" height="66" rx="6" style="fill:var(--es-void,#131316)"></rect>
<rect x="130" y="64" width="16" height="3" rx="1.5" style="fill:var(--es-line,#3a3b45)"></rect>
<g class="e plp"><circle cx="138" cy="103" r="12" fill="none" stroke-width="2.5" stroke-dasharray="4 3" style="stroke:var(--es-accent,#a78bfa)"></circle><path d="M138 97v12M132 103h12" stroke-width="3" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></path></g>
</g></g>
</svg>