<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" class="es-svg">
<style>
.es-svg .e{transform-box:fill-box;transform-origin:center}
.es-svg .in{animation:es-pop .7s cubic-bezier(.2,.9,.3,1.25) both}
.es-svg .fl{animation:es-fl 3.4s ease-in-out .8s infinite}
.es-svg .glow{animation:es-glow 3.4s ease-in-out .8s infinite}
@keyframes es-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}70%{opacity:1;transform:scale(1.05) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes es-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes es-glow{0%,100%{opacity:.7}50%{opacity:1}}
.es-svg .gl{animation:es-gl 4.2s steps(1,end) 1s infinite}
.es-svg .gr{animation:es-gr 4.2s steps(1,end) 1s infinite;opacity:0}
.es-svg .rd{animation:es-rd 4.2s steps(1,end) 1s infinite;opacity:0}
.es-svg .sat{animation:es-sat 6s ease-in-out .9s infinite}
.es-svg .pg{animation:es-pg 2.4s ease-in-out .9s infinite}
.es-svg .st{animation:es-st 3s ease-in-out infinite}
@keyframes es-gl{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-3px,1px)}93%{transform:translate(3px,-1px)}96%{transform:translate(-2px,0)}}
@keyframes es-gr{0%,88%,95%,100%{opacity:0}90%,94%{opacity:.6}}
@keyframes es-rd{0%,88%,97%,100%{opacity:0}91%,96%{opacity:.6}}
@keyframes es-sat{0%,100%{transform:translate(0,0) rotate(-14deg)}50%{transform:translate(4px,-8px) rotate(-4deg)}}
@keyframes es-pg{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes es-st{0%,100%{opacity:.15}50%{opacity:.9}}</style>
<defs><radialGradient id="g-notfound" cx="50%" cy="55%" r="50%"><stop offset="0" stop-opacity=".22" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop><stop offset="1" stop-opacity="0" style="stop-color:var(--es-accent-deep,#7c5cf5)"></stop></radialGradient></defs>
<circle class="glow" cx="100" cy="104" r="88" fill="url(#g-notfound)"></circle>
<g style="fill:var(--es-accent,#a78bfa)"><circle class="e st" cx="34" cy="44" r="2"></circle><circle class="e st" style="animation-delay:.8s" cx="170" cy="150" r="1.6"></circle><circle class="e st" style="animation-delay:1.6s" cx="150" cy="30" r="1.4"></circle><circle class="e st" style="animation-delay:2.2s" cx="44" cy="160" r="1.8"></circle></g>
<g class="e in"><g class="e fl"><g font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="64" text-anchor="middle">
<g class="e rd"><text x="100" y="124" style="fill:var(--es-danger,#f04747)">404</text></g>
<g class="e gr"><text x="100" y="124" style="fill:var(--es-success,#2bb3a3)">404</text></g>
<g class="e gl"><text x="100" y="124" style="fill:var(--es-paper,#e4e4e8)">404</text></g>
</g></g></g>
<g class="e in" style="animation-delay:.3s"><g class="e sat">
<rect x="128" y="32" width="14" height="28" rx="3" style="fill:var(--es-line,#3a3b45)"></rect><rect x="146" y="32" width="14" height="28" rx="3" style="fill:var(--es-line,#3a3b45)"></rect>
<rect x="141" y="40" width="6" height="12" rx="2" stroke-width="2" style="fill:var(--es-surface,#23242b);stroke:var(--es-accent,#a78bfa)"></rect>
<line x1="144" y1="40" x2="144" y2="30" stroke-width="2" stroke-linecap="round" style="stroke:var(--es-accent,#a78bfa)"></line>
<circle class="e pg" cx="144" cy="28" r="3" style="fill:var(--es-accent,#a78bfa)"></circle>
</g></g>
<g class="e in" style="animation-delay:.45s"><rect x="56" y="140" width="88" height="6" rx="3" style="fill:var(--es-surface-2,#2c2d34)"></rect><rect x="72" y="152" width="56" height="6" rx="3" style="fill:var(--es-surface,#23242b)"></rect></g>
</svg>