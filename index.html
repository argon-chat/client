<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Argon</title>
    <meta name="description" content="Argon - voice, video and text for communities." />
    <meta name="application-name" content="Argon" />

    <!--
      The app lives behind a sign-in and has nothing anyone could usefully index. robots.txt asks
      crawlers not to fetch these pages; this asks the ones that learn a URL by other means not to
      list it. They answer different questions and neither stands in for the other.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Declared for both themes so the browser paints its own chrome to match before Vue has mounted
      and could say which one is in use. Values mirror src/style.css; change them together.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)" />

    <!--
      The desktop application's own icon, so a pinned tab and an installed window are recognisably
      the same program. Rendered from the 1024px master inside ArgonApp/appicon.icns rather than
      scaled up from the .ico, which holds one 256px image and nothing larger.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-256.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Installable as an app. Chromium will not offer it without a manifest carrying BOTH a 192px
      and a 512px icon, a start_url, and a display mode — miss any one and the install option
      simply never appears, with nothing said about why.

      iOS reads none of that: it has always taken these three meta tags instead, and ignoring them
      leaves an installed icon that opens in a Safari chrome with an address bar.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Argon" />

    <!--
      What a pasted link looks like in someone else's chat. Absolute URLs on purpose: a crawler
      resolves a relative one against its own host and quietly gets nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Argon" />
    <meta property="og:title" content="Argon" />
    <meta property="og:description" content="Argon - voice, video and text for communities." />
    <meta property="og:url" content="https://app.argon.gl/" />
    <meta property="og:image" content="https://app.argon.gl/icon-256.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://api.argon.gl" />
    <link rel="preconnect" href="https://rts.argon.gl" />
    <link href="https://emoji-css.afeld.me/emoji.css" rel="stylesheet">
    <link rel="stylesheet" href="/packages/assets/fonts/fonts.css">
    <!--
      The loading overlay and the boot gate are drawn long before Vue mounts and applies the
      appearance settings, so the theme class has to be on <html> already - otherwise every start
      flashes the wrong theme. Mirrors useTheme(): "system" follows the OS, and anything that is
      not "light" (dark, oled) is dark.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var raw = localStorage.getItem("appearance.theme");
          if (raw) {
            // Written by persistedValue() through superjson, i.e. {"json":"dark"}.
            var parsed = JSON.parse(raw);
            theme = (parsed && typeof parsed === "object" ? parsed.json : parsed) || "dark";
          }
        } catch (e) {
          /* unreadable storage - the default stands */
        }
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        if (theme !== "light") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <!-- SVG filters for color blindness simulation -->
    <svg style="display: none;">
      <defs>
        <!-- Protanopia (Red-Blind) -->
        <filter id="protanopia-filter">
          <feColorMatrix type="matrix" values="
            0.567, 0.433, 0,     0, 0
            0.558, 0.442, 0,     0, 0
            0,     0.242, 0.758, 0, 0
            0,     0,     0,     1, 0"/>
        </filter>
        
        <!-- Deuteranopia (Green-Blind) -->
        <filter id="deuteranopia-filter">
          <feColorMatrix type="matrix" values="
            0.625, 0.375, 0,   0, 0
            0.7,   0.3,   0,   0, 0
            0,     0.3,   0.7, 0, 0
            0,     0,     0,   1, 0"/>
        </filter>
        
        <!-- Tritanopia (Blue-Blind) -->
        <filter id="tritanopia-filter">
          <feColorMatrix type="matrix" values="
            0.95, 0.05,  0,     0, 0
            0,    0.433, 0.567, 0, 0
            0,    0.475, 0.525, 0, 0
            0,    0,     0,     1, 0"/>
        </filter>
      </defs>
    </svg>
    
    <div vaul-drawer-wrapper id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      button.separate-window {
        display: none !important;
      }
      
      button:focus,
      button:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      :root {
  /* Color System */
  --editor-text-default: hsl(240 10% 3.9%);
  --editor-text-gray: hsl(240 3.8% 46.1%);
  --editor-text-brown: hsl(25 95% 53%);
  --editor-text-orange: hsl(24 95% 53%);
  --editor-text-yellow: hsl(48 96% 53%);

  --editor-text-purple: hsl(269 97% 85%);
  --editor-text-pink: hsl(336 80% 58%);
  --editor-text-red: hsl(0 84% 60%);

  /* Background Colors */
  --editor-bg-default: hsl(0 0% 100%);
  --editor-bg-subtle: hsl(0 0% 98%);
  --editor-bg-muted: hsl(240 5% 96%);
  
  /* Highlight Colors */
  --editor-highlight-default: hsl(0 0% 98%);
  --editor-highlight-gray: hsl(240 5% 96%);
  --editor-highlight-brown: hsl(43 96% 96%);
  --editor-highlight-orange: hsl(33 100% 96%);
  --editor-highlight-yellow: hsl(54 100% 96%);
  --editor-highlight-green: hsl(142 71% 96%);
  --editor-highlight-blue: hsl(217 91% 96%);
  --editor-highlight-purple: hsl(269 97% 96%);
  --editor-highlight-pink: hsl(336 80% 96%);
  --editor-highlight-red: hsl(0 84% 96%);

  /* Border Colors */
  --editor-border-default: hsl(240 5% 88%);
  --editor-border-strong: hsl(240 5% 65%);

  /* Spacing System */
  --editor-spacing-1: 0.25rem;
  --editor-spacing-2: 0.5rem;
  --editor-spacing-3: 0.75rem;
  --editor-spacing-4: 1rem;
  --editor-spacing-6: 1.5rem;
  --editor-spacing-8: 2rem;
  --editor-spacing-12: 3rem;
  --editor-spacing-16: 4rem;

  /* Typography */

  --editor-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --editor-font-serif: Georgia, Cambria, "Times New Roman", Times, serif;

  /* Animation */
  --editor-transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --editor-transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  --editor-transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);

  /* Shadows */
  --editor-shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --editor-shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --editor-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}

/* Dark Mode Custom Properties */
.dark {
  --editor-text-default: hsl(0 0% 98%);
  --editor-text-gray: hsl(240 5% 64.9%);
  --editor-text-brown: hsl(25 95% 53%);
  --editor-text-orange: hsl(24 95% 53%);
  --editor-text-yellow: hsl(48 96% 53%);
  --editor-text-green: hsl(142 71% 45%);
  --editor-text-blue: hsl(221 83% 53%);
  --editor-text-purple: hsl(269 97% 85%);
  --editor-text-pink: hsl(336 80% 58%);
  --editor-text-red: hsl(0 84% 60%);

  --editor-bg-default: hsl(240 10% 3.9%);
  --editor-bg-subtle: hsl(240 3.7% 15.9%);
  --editor-bg-muted: hsl(240 5% 26%);

  --editor-highlight-default: hsl(240 3.7% 15.9%);
  --editor-highlight-gray: hsl(240 5% 26%);
  --editor-highlight-brown: hsl(43 96% 10%);
  --editor-highlight-orange: hsl(33 100% 10%);
  --editor-highlight-yellow: hsl(54 100% 10%);
  --editor-highlight-green: hsl(142 71% 10%);
  --editor-highlight-blue: hsl(217 91% 10%);
  --editor-highlight-purple: hsl(269 97% 10%);
  --editor-highlight-pink: hsl(336 80% 10%);
  --editor-highlight-red: hsl(0 84% 10%);

  --editor-border-default: hsl(240 5% 26%);
  --editor-border-strong: hsl(240 5% 64.9%);
}

.disabled {
  cursor: not-allowed;
}

body {
  font-family: 'Inter', sans-serif;
}

}
